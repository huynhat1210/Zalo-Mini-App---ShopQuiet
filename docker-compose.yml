services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: shopquiet-keycloak
    command: start-dev --import-realm
    env_file:
      - ./.keycloak.local
    environment:
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak-realm-export.json:/opt/keycloak/data/import/shopquiet-realm.json:ro
    restart: unless-stopped

volumes:
  keycloak_data:
    driver: local
