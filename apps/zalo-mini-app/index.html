<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>SoftShop</title>
    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Suppress Zalo SDK "Script error. null" popup — must be FIRST script -->
    <script>
      // Aggressive error suppression for Zalo Mini App environment
      window.onerror = function(message, source, lineno, colno, error) {
        // Suppress all Zalo SDK cross-origin errors
        if (message === "Script error" || message === "Script error. null" || message === null) {
          return true;
        }
        // Log other errors but don't crash
        console.error('[App Error]', message, source, lineno, error);
        return false;
      };

      // Also suppress unhandled promise rejections
      window.onunhandledrejection = function(event) {
        if (event.reason && (event.reason.message === "Script error" || event.reason.message === "Script error. null")) {
          event.preventDefault();
          return true;
        }
        console.error('[Unhandled Promise Rejection]', event.reason);
        event.preventDefault();
        return false;
      };
    </script>
    <script>
      (function() {
        try {
          var t = localStorage.getItem("shopquiet_theme");
          if (!t) {
            var store = localStorage.getItem("shopquiet_app_store");
            if (store) {
              var parsed = JSON.parse(store);
              t = parsed && parsed.state && parsed.state.theme;
            }
          }
          if (t === "dark" || (!t && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-surface dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans transition-colors duration-200">
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
