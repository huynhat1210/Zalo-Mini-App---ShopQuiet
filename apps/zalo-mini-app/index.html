<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>SoftShop</title>
    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Suppress Zalo SDK "Script error. null" popup — must be FIRST script -->
    <script>
      // Override console methods to completely suppress Zalo SDK error logs
      (function() {
        const originalError = console.error;
        const originalWarn = console.warn;
        const originalLog = console.log;

        console.error = function(...args) {
          const message = args[0];
          if (message === "Script error" || message === "Script error. null" || message === null) {
            return;
          }
          originalError.apply(console, args);
        };

        console.warn = function(...args) {
          const message = args[0];
          if (message === "Script error" || message === "Script error. null" || message === null) {
            return;
          }
          originalWarn.apply(console, args);
        };

        console.log = function(...args) {
          const message = args[0];
          if (message === "Script error" || message === "Script error. null" || message === null) {
            return;
          }
          originalLog.apply(console, args);
        };
      })();

      // Aggressive error suppression for Zalo Mini App environment
      window.onerror = function(message, source, lineno, colno, error) {
        // Suppress all Zalo SDK cross-origin errors
        if (message === "Script error" || message === "Script error. null" || message === null) {
          return true;
        }
        // Log other errors but don't crash
        console.error('[App Error]', message, source, lineno, error);
        return false;
      };

      // Also suppress unhandled promise rejections
      window.onunhandledrejection = function(event) {
        if (event.reason && (event.reason.message === "Script error" || event.reason.message === "Script error. null" || event.reason.message === null)) {
          event.preventDefault();
          return true;
        }
        console.error('[Unhandled Promise Rejection]', event.reason);
        event.preventDefault();
        return false;
      };
    </script>
  </head>
  <body class="bg-surface text-slate-900 font-sans transition-colors duration-200">
    <div id="app">
      <!-- Loading fallback to prevent blank screen -->
      <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background: #f9fafb;">
        <div style="text-align: center;">
          <div style="width: 40px; height: 40px; border: 3px solid #e5e7eb; border-top-color: #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;"></div>
          <p style="margin-top: 16px; color: #6b7280; font-size: 14px;">Đang tải...</p>
        </div>
      </div>
      <style>
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
